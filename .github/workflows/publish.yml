name: Monitor Calendar Feeds and Publish Hub
on:
  push:
    branches: [main]
  schedule:
    # 09:30 America/Phoenix (UTC-7), every day
    - cron: '30 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: calendar-hub-publishing
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and image extraction dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement projects/requirements-temples.txt
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi
          tesseract --version | head -n 1
      - name: Run regression tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --input-type=module --check < scriptable/CalendarHubWidget.js
          node tests/test_scriptable.mjs
      - name: Build and validate four independent ICS feeds
        run: |
          python -m unittest projects.test_feeds projects.test_temple_extraction projects.test_source_audits projects.test_ekta_events projects.test_dated_temple_events projects.test_temple_reconciliation -v
          python -m projects.build_feeds --out dist/feeds
      - name: Verify live ICS feeds and generate dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.build --config config/feeds.json --out dist
      - name: Upload health report (even if checks fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-health-report
          path: dist/status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Check GitHub Pages status
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Enable Pages manually: Settings > Pages > Source > GitHub Actions"
          fi
      - name: Configure Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify public ICS subscriptions and published Hub
        if: steps.pages_check.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone, timedelta
          from html import unescape
          from urllib.request import Request, urlopen
          root="https://vihari23.github.io/Calendar-Hub/"
          expected=("arizona-telugu","phoenix-temples","workday-releases","phoenix-road-closures")
          def fetch(name):
              last=None
              for attempt in range(10):
                  try:
                      request=Request(root+name+"?fresh=${{ github.sha }}",headers={"User-Agent":"CalendarHubValidation/1.0","Cache-Control":"no-cache"})
                      with urlopen(request,timeout=18) as response:
                          if response.status!=200:
                              raise ValueError("HTTP "+str(response.status))
                          return response.read(3_000_001)
                  except Exception as exc:
                      last=exc
                      time.sleep(5)
              raise RuntimeError(name+": failed public fetch: "+str(last))
          status=json.loads(fetch("status.json"))
          names={f["id"]:f for f in status["feeds"]}
          assert len(names)==7 and all(slug in names for slug in expected),names
          stamp=datetime.fromisoformat(status["checked_at_utc"])
          assert datetime.now(timezone.utc)-stamp<timedelta(minutes=30),"Hub status is not from latest publication"
          widget=json.loads(fetch("widget.json"))
          assert {f["id"] for f in widget["feeds"]}==set(names)
          source=json.loads(fetch("feeds/source-status.json"))
          review=json.loads(fetch("feeds/temple-review.json"))
          reconciliation=json.loads(fetch("feeds/temple-reconciliation.json"))
          assert reconciliation["schema_version"]==1,"Invalid temple completeness report schema"
          assert reconciliation["verified_expected"]>=0
          assert "ocr_review" in reconciliation
          assert "source_coverage_gaps" in reconciliation
          assert review["verified_reconciliation_passed"]==reconciliation["verified_passed"]
          assert review["verified_reconciliation_failures"]==reconciliation["verified_failures"]
          assert source["phoenix-temples"]["verified_reconciliation_passed"]==reconciliation["verified_passed"]
          # After deployment so the diagnostics remain accessible even on failure.
          assert reconciliation["verified_passed"],"Confirmed temple flyer events missing, duplicated or timed incorrectly; see feeds/temple-reconciliation.json"
          assert review["registered_sources"]>=10
          assert len(review["source_audits"])==review["registered_sources"],"Not all temple sources audited"
          assert review["requires_human_review"] is True
          assert source["phoenix-temples"]["source_checks"]==review["registered_sources"]
          indexed={r["name"]:r for r in review["source_audits"]}
          for temple in ("Sri Lalitha Temple","Sri Bhakta Hanuman Temple"):
              row=indexed[temple]
              assert row.get("dated_schedule_status") in (
                  "future_events","outdated_schedule","no_qualifying_events","no_dated_events"
              ),temple+" event importer did not complete"
              assert "latest_explicit_event_date" in row,temple+" missing source freshness tracking"
              assert row.get("auto_published",0)>=0
          telugu=json.loads(fetch("feeds/telugu-review.json"))
          workday=json.loads(fetch("feeds/workday-review.json"))
          road=json.loads(fetch("feeds/road-audit.json"))
          assert len(telugu["source_audits"])==telugu["registered_sources"]==12
          assert len(workday["source_audits"])==workday["registered_sources"]==4
          assert len(road["source_audits"])==road["checked_sources"]==road["registered_sources"]==3
          assert source["arizona-telugu"]["source_checks"]==12
          assert source["workday-releases"]["source_checks"]==4
          assert source["phoenix-road-closures"]["source_checks"]==3
          assert telugu["requires_human_review"] and workday["requires_human_review"]
          print("Full-source audits verified: Telugu 12, Workday 4, road 3")
          for slug in expected:
              body=fetch("feeds/"+slug+".ics")
              assert body.startswith(b"BEGIN:VCALENDAR\r\n"),slug+" missing calendar start"
              assert body.endswith(b"END:VCALENDAR\r\n"),slug+" missing calendar end"
              assert b"X-VIHARI-GENERATED-UTC:" in body,slug+" missing generation marker"
              assert body.count(b"BEGIN:VEVENT")==body.count(b"END:VEVENT"),slug+" invalid event boundaries"
              assert body.count(b"BEGIN:VEVENT")==names[slug]["events"],slug+" event count does not match published Hub"
              assert body.count(b"BEGIN:VEVENT")==source[slug]["events"],slug+" event count does not match source report"
              assert all(len(x)<=75 for x in body.split(b"\r\n")),slug+" ICS line exceeds 75 octets"
              print(slug,"HTTP 200; RFC-style ICS boundaries valid; events",names[slug]["events"])
          html=fetch("index.html").decode("utf-8")
          assert all(names[slug]["name"] in unescape(html) for slug in expected)
          print("Public dashboard, seven feeds, widget, source diagnostics: verified")
          PY
      - name: Fail if monitoring detected unhealthy sources
        run: |
          python - <<'PY'
          import json
          status = json.load(open("dist/status.json", encoding="utf8"))
          if not status["healthy"]:
              raise SystemExit("At least one ICS feed is unhealthy. Inspect the calendar-health-report artifact.")
          print("All configured calendar feeds healthy.")
          PY
