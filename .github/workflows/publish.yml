name: Monitor Calendar Feeds and Publish Hub
on:
  push:
    branches: [main]
  schedule:
    # 09:30 America/Phoenix (UTC-7), every day
    - cron: '30 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: calendar-hub-publishing
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --input-type=module --check < scriptable/CalendarHubWidget.js
          node tests/test_scriptable.mjs
      - name: Verify live ICS feeds and generate dashboard
        run: python -m scripts.build --config config/feeds.json --out dist
      - name: Upload health report (even if checks fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-health-report
          path: dist/status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Check GitHub Pages status
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Enable Pages manually: Settings > Pages > Source > GitHub Actions"
          fi
      - name: Configure Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
      - name: Fail if monitoring detected unhealthy sources
        run: |
          python - <<'PY'
          import json
          status = json.load(open("dist/status.json", encoding="utf8"))
          if not status["healthy"]:
              raise SystemExit("At least one ICS feed is unhealthy. Inspect the calendar-health-report artifact.")
          print("All configured calendar feeds healthy.")
          PY
